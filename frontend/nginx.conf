# Upgrade only requests that ask for it (the TV-mode room sockets); plain API
# calls keep a normal Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API routes to the backend service.
    # proxy_buffering off is required for the SSE progress stream (/analysis/stream/).
    location ~ ^/(health|auth|analysis|songs|search|playlists|rooms)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
    }

    # SPA fallback — serve index.html for all unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
